[project]
name = "topbrain2026"
version = "0.1.0"
description = "TopBrain 2026 whole-brain vessel segmentation experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "nnunetv2>=2.6",
    "nibabel>=5.2",
    "numpy>=1.26",
    "SimpleITK>=2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
